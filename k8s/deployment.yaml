apiVersion: apps/v1
kind: Deployment
metadata:
  name: maffia-game
  labels:
    app: maffia-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maffia-game
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: maffia-game
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maffia-game
          image: maffia-game:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8098
          env:
            - name: PORT
              value: "8098"
            - name: BASE_PATH
              value: "/maffia"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: SESSION_TTL_SECONDS
              value: "21600"
          readinessProbe:
            httpGet:
              path: /maffia/api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
