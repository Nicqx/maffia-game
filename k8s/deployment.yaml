apiVersion: apps/v1
kind: Deployment
metadata:
  name: maffia-game
  labels:
    app: maffia-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maffia-game
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: maffia-game
    spec:
      containers:
        - name: maffia-game
          image: maffia-game:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8098
          env:
            - name: PORT
              value: "8098"
            - name: BASE_PATH
              value: "/maffia"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: SESSION_TTL_SECONDS
              value: "21600"
          readinessProbe:
            httpGet:
              path: /maffia/api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /maffia/api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
